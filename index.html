<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>82TRADE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+TC:wght@300;400;500;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#0B0D0F; --panel:#111417; --line:#2A2E31; --line-2:#1E2226;
    --cyan:#3EC1DD; --txt:#F2F3F4; --sub:#8A9196; --mute:#5B6165;
    --cn:"Noto Sans TC",system-ui,sans-serif; --mo:"IBM Plex Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);
    font-family:var(--cn);font-weight:300;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:32px 20px}
  body::before{content:"";position:fixed;inset:0;z-index:-1;opacity:.5;
    background:repeating-linear-gradient(45deg,#14181C 0 1.1px,transparent 1.1px 9px)}
  .box{width:100%;max-width:420px}
  .lg{display:flex;align-items:center;gap:10px;font-family:"Archivo Black",var(--cn);
    font-size:20px;letter-spacing:.04em}
  .lg i{width:22px;height:22px;border-radius:6px;display:block;
    background:linear-gradient(180deg,var(--cyan) 0 20%,#FFFFFF 20% 100%)}
  .bar{margin:16px 0 0;height:3px;display:flex;gap:3px}
  .bar i{display:block;height:3px;border-radius:2px}
  .bar i:first-child{width:20%;background:var(--cyan)}
  .bar i:last-child{flex:1;background:var(--line-2)}
  p{margin:26px 0 0;font-size:14px;line-height:2;color:var(--sub)}
  a.link{margin:26px 0 0;display:flex;align-items:center;justify-content:space-between;gap:14px;
    border:1px solid var(--line);background:var(--panel);border-radius:14px;
    padding:16px 18px;color:var(--txt);text-decoration:none;font-size:14.5px;
    transition:border-color .18s,background .18s}
  a.link:hover{border-color:#33707E;background:#12181C}
  a.link span.go{font-family:var(--mo);font-size:11px;letter-spacing:.18em;color:var(--cyan)}
  .foot{margin:34px 0 0;font-family:var(--mo);font-size:10px;letter-spacing:.24em;color:var(--mute)}
</style>

<div class="box">
  <span class="lg"><i></i><span>82TRADE</span></span>
  <div class="bar"><i></i><i></i></div>
  <p>官網整理中。目前開放的頁面在下面。</p>
  <a class="link" href="./class/">
    <span>第一堂免費公開課・登記</span>
    <span class="go">OPEN</span>
  </a>
  <p class="foot">READ THE MARKET.</p>
</div>
</html>
